global:
  scrape_interval: 15s

scrape_configs:
  - job_name: airbank-gateway
    metrics_path: /actuator/prometheus
    static_configs: [ { targets: [ "airbank-gateway:8080" ] } ]
  - job_name: airbank-uam
    metrics_path: /api/uam/actuator/prometheus
    static_configs: [ { targets: [ "airbank-uam:8083" ] } ]
  - job_name: airbank-core
    metrics_path: /api/core/actuator/prometheus
    static_configs: [ { targets: [ "airbank-core:8081" ] } ]
  - job_name: airbank-wealth
    metrics_path: /api/wealth/actuator/prometheus
    static_configs: [ { targets: [ "airbank-wealth:8082" ] } ]
  - job_name: airbank-counter
    metrics_path: /api/counter/actuator/prometheus
    static_configs: [ { targets: [ "airbank-counter:8084" ] } ]
  - job_name: airbank-ebank
    metrics_path: /api/ebank/actuator/prometheus
    static_configs: [ { targets: [ "airbank-ebank:8085" ] } ]
