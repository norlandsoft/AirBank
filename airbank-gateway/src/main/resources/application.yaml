server:
  port: 8080
  shutdown: graceful
spring:
  application:
    name: airbank-gateway
  config:
    import: optional:nacos:airbank-common.yaml,optional:nacos:airbank-gateway.yaml
  cloud:
    nacos:
      server-addr: ${NACOS_ADDR:localhost:8848}
      discovery:
        namespace: ${NACOS_NAMESPACE:airbank-dev}
        group: AIRBANK_GROUP
      config:
        namespace: ${NACOS_NAMESPACE:airbank-dev}
        group: AIRBANK_GROUP
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 30s
      routes:
        - id: uam
          uri: lb://airbank-uam
          predicates: [ "Path=/api/uam/**" ]
        - id: core
          uri: lb://airbank-core
          predicates: [ "Path=/api/core/**" ]
        - id: wealth
          uri: lb://airbank-wealth
          predicates: [ "Path=/api/wealth/**" ]
        - id: counter
          uri: lb://airbank-counter
          predicates: [ "Path=/api/counter/**" ]
        - id: ebank
          uri: lb://airbank-ebank
          predicates: [ "Path=/api/ebank/**" ]
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            maxAge: 3600
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-}] %logger{36} - %msg%n"
